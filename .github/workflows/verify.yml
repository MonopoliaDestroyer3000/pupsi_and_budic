name: verify
on: [push, pull_request, workflow_dispatch]
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - run: python -m unittest discover -s tests -v
      - run: python tools/benchmark.py --synthetic --count 100 --seed 74 --output .work/ci-benchmark.json
      - run: docker build -t hack:latest .
      - run: python tools/generate_training.py --output .work/container-tasks --count 100 --seed 75
      - name: Run with the judge filesystem restrictions
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp:rw,size=2g \
            --cap-drop ALL --security-opt no-new-privileges --cpus 4 --memory 16g \
            --pids-limit 512 -e HOME=/tmp -e BUDGET=7000 \
            -v "$PWD/.work/container-tasks:/data/tasks:rw" \
            --workdir /app --entrypoint python hack:latest \
            /app/run_agent.py --tasks-dir /data/tasks > .work/container-result.json
          python -c "import json; r=json.load(open('.work/container-result.json')); assert r['submitted']==80; assert r['budget']['spent']==0, r"
      - run: docker images --format '{{.Repository}}:{{.Tag}} -> {{.Size}}'
